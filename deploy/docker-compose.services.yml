# shieldscan-engine — persistent Docker service definitions
#
# Used for local development + CI integration runs. M7 task implementations
# (MobSF, ZAP, Trivy, SQLMap runners) consume these services via the
# DockerServiceRunner type from internal/tools/docker_service.go.
#
# Local dev usage:
#   docker-compose -f deploy/docker-compose.services.yml up -d
#
# Image pins MUST match VERSIONS.md §2.5 — the validation test
# deploy/docker_compose_test.go grep-checks pinned tags.
#
# In production, tags should be replaced with image@sha256:<digest>
# per VERSIONS.md guidance to prevent image substitution attacks.

version: '3.8'

services:
  # MobSF service entry removed per Task 7.4 Q3 lock + Q5 Option β v1
  # ephemeral-container default. MobSF is now spun up per-scan via
  # internal/tools/docker/service/mobsf (Task 7.4 commit) using the
  # DockerServiceRunner framework (Task 7.5b commit 1306ca8) with
  # cfg.EphemeralContainer = true; no long-running compose service.
  # Forward-pin: if Task 7.5d V4-analogue verification recommends
  # warm-pool flip (delete_scan idempotency confirmed across surfaces),
  # MobSF returns to compose OR continues lazy-spin via WarmPool framework.
  #
  # ZAP service entry also removed per Task 7.3 Q3 lock + Task 7.5b V4
  # Option γ ephemeral-container default; spun up per-scan via
  # internal/tools/docker/service/zap.

  trivy:
    image: aquasec/trivy:0.58.0
    container_name: shieldscan-trivy
    command: server --listen 0.0.0.0:4954
    ports:
      - "4954:4954"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4954/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  sqlmap:
    image: paoloo/sqlmap:1.9
    container_name: shieldscan-sqlmap
    ports:
      - "8775:8775"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8775/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
