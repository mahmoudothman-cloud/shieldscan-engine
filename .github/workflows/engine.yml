name: engine

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Verify module dependencies
        run: go mod download

      - name: go vet (lostcancel forcing function for ADR-021)
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: go build worker binary
        run: go build -o /tmp/worker ./cmd/worker/

      - uses: golangci/golangci-lint-action@v6
        with:
          version: 'v2.11.4'
